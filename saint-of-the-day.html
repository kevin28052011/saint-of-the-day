<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saint of the Day – 365 Days of Faith</title>
<meta name="description" content="Discover the lives, faith, sacrifices and teachings of the saints, one day at a time.">
<meta property="og:type" content="website"><meta property="og:title" content="Saint of the Day – 365 Days of Faith">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Sans+Tamil:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#14285a;--navy2:#1d3a7a;--gold:#b8892b;--gold2:#e2b857;--bg:#fff;--soft:#f5f6fb;--ink:#1a1f33;--mute:#5a6178;--line:#dfe3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1630;--soft:#132048;--ink:#eef1fa;--mute:#a9b2cf;--line:#26346a;--navy:#e2b857;--navy2:#e2b857;--gold:#e2b857}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3","Noto Sans Tamil",system-ui,sans-serif;padding-bottom:76px}
h1,h2,h3{font-family:"Cormorant Garamond","Noto Sans Tamil",serif;color:var(--navy);line-height:1.2;margin:.2em 0 .4em}
h1{font-size:2.3rem}h2{font-size:1.7rem}h3{font-size:1.3rem}
a{color:var(--navy2)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:10px;padding:8px 14px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:"Cormorant Garamond",serif;font-weight:700;color:var(--navy);font-size:1.2rem;line-height:1}
.logo small{display:block;font:600 .62rem "Source Sans 3";color:var(--gold);letter-spacing:.08em}
nav.top{display:none;margin-left:auto;gap:4px}
nav button,.chip,.btn{font:inherit;cursor:pointer;border-radius:999px;min-height:44px}
nav.top button{border:0;background:none;padding:0 12px;color:var(--ink)}
nav.top button.on{color:var(--gold);font-weight:600;border-bottom:2px solid var(--gold);border-radius:0}
.lang{margin-left:auto;display:flex;border:1px solid var(--gold);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:0 12px;min-height:38px;color:var(--ink);font:inherit;cursor:pointer}
.lang button.on{background:var(--navy);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lang button.on{color:#0d1630}}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--gold);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.bottom button{flex:1;border:0;background:none;padding:8px 2px;color:var(--mute);font-size:.72rem;min-height:56px;cursor:pointer}
nav.bottom button.on{color:var(--gold);font-weight:600}nav.bottom span{display:block;font-size:1.25rem}
@media(min-width:800px){nav.top{display:flex}nav.bottom{display:none}body{padding-bottom:0}.lang{margin-left:8px}}
main{max-width:980px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(160deg,var(--navy),#0c1a44);color:#fff;border-radius:18px;padding:26px 18px;text-align:center;border-bottom:4px solid var(--gold2);position:relative;overflow:hidden}
.hero h1,.hero h2{color:#fff;margin:0}.hero .tag{color:var(--gold2);letter-spacing:.2em;font-weight:600;font-size:.85rem}
.hero .stars{color:var(--gold2);letter-spacing:.6em}
.hl{display:block;width:min(270px,72%);margin:0 auto 10px;background:#fff;border-radius:16px;padding:6px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.portrait{width:190px;height:190px;margin:14px auto;border-radius:50%;background:radial-gradient(#fff 55%,#f3e2b0);border:4px solid var(--gold2);display:grid;place-items:center;font-size:5rem;position:relative;box-shadow:0 0 0 8px rgba(226,184,87,.25)}
.portrait::before{content:"";position:absolute;top:-14px;width:70px;height:16px;border:3px solid var(--gold2);border-radius:50%}
.hero p{max-width:52ch;margin:.5em auto}
.btn{border:2px solid var(--gold2);background:var(--gold2);color:#14285a;padding:0 20px;font-weight:600;margin:4px}
.btn.alt{background:none;color:#fff}.btn.dk{background:var(--navy);color:#fff;border-color:var(--navy)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.dk{color:#0d1630}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px;cursor:pointer}
.card .em{font-size:2rem}.meta{color:var(--mute);font-size:.9rem}
.sec{margin:28px 0}
input,select,textarea{font:inherit;width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.filters{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:10px 0}
.chip{border:1px solid var(--gold);background:none;color:var(--ink);padding:0 14px;margin:2px}
.tag2{display:inline-block;background:var(--soft);border:1px solid var(--gold);border-radius:999px;padding:0 10px;font-size:.85rem;margin:2px}
.verse{border-left:4px solid var(--gold);padding:6px 14px;font-family:"Cormorant Garamond","Noto Sans Tamil",serif;font-size:1.3rem;background:var(--soft)}
.vid{aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:12px;display:grid;place-items:center;font-size:3rem}
.note{font-size:.85rem;color:var(--mute);border:1px dashed var(--gold);border-radius:8px;padding:8px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:8px;color:var(--ink);cursor:pointer}
.cal button.has{border-color:var(--gold);background:var(--soft);font-weight:600}.cal button.sel{background:var(--navy);color:#fff}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:24px 16px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style></head><body>

{id:"saint-devasahayam-pillai",m:1,d:"01-14",e:"👑",n:["Saint Devasahayam Pillai","புனித தேவசகாயம் பிள்ளை"],t:["martyr","layperson"],c:["India","இந்தியா"],p:["Converts, Tamil Nadu","மனந்திரும்பியோர், தமிழ்நாடு"],b:["1712–1752","1712–1752"],bio:["A Hindu court official in the kingdom of Travancore who became Catholic in 1745. He was arrested, tortured and shot in 1752 for his faith, and canonized by Pope Francis in 2022. He is the first Indian layman canonized as a martyr.","திருவிதாங்கூர் அரசவை அதிகாரியாக இருந்த இவர் 1745-ல் கத்தோலிக்க விசுவாசத்தை ஏற்றார். 1752-ல் விசுவாசத்திற்காகச் சித்திரவதை செய்யப்பட்டுச் சுட்டுக் கொல்லப்பட்டார். 2022-ல் திருத்தந்தை பிரான்சிஸ் இவரைப் புனிதராக அறிவித்தார்."],r:["saint-thomas-apostle","saint-francis-xavier"]},
{id:"saint-patrick",d:"03-17",e:"☘️",n:["Saint Patrick","புனித பேட்ரிக்"],t:["bishop"],c:["Ireland","அயர்லாந்து"],p:["Ireland","அயர்லாந்து"],b:["5th century","5-ஆம் நூற்றாண்டு"],bio:["A Romano-British Christian who was taken to Ireland as a slave, escaped, and later returned as a bishop to preach the Gospel. His own writings, the Confession and a Letter, survive.","ரோமானிய-பிரிட்டன் கிறிஸ்தவரான இவர் அடிமையாக அயர்லாந்துக்குக் கொண்டுசெல்லப்பட்டு, தப்பிச்சென்று, பின்னர் ஆயராகத் திரும்பி நற்செய்தியை அறிவித்தார். இவரது 'அறிக்கை' மற்றும் ஒரு கடிதம் இன்றும் உள்ளன."],r:["saint-francis-of-assisi"]},
{id:"saint-joseph",d:"03-19",e:"🔨",n:["Saint Joseph","புனித யோசேப்பு"],t:["confessor"],c:["Israel","இஸ்ரேல்"],p:["Fathers, workers, the universal Church","தந்தையர், தொழிலாளர், உலகத் திருச்சபை"],b:["1st century","1-ஆம் நூற்றாண்டு"],bio:["Husband of Mary and foster father of Jesus, a carpenter of Nazareth. The Gospels present him as a just man who obeyed God's call.","மரியாவின் கணவரும் இயேசுவின் வளர்ப்புத் தந்தையுமான நசரேத்தின் தச்சர். நற்செய்திகள் இவரை இறைவனின் அழைப்புக்குக் கீழ்ப்படிந்த நீதிமானாகக் காட்டுகின்றன."],r:["saint-anthony-of-padua"]},
{id:"saint-anthony-of-padua",m:1,d:"06-13",e:"📖",n:["Saint Anthony of Padua","புனித பதுவை அந்தோணியார்"],t:["priest","religious","doctor"],c:["Portugal / Italy","போர்ச்சுகல் / இத்தாலி"],p:["Lost items, the poor","காணாமல் போனவை, ஏழைகள்"],b:["1195–1231","1195–1231"],bio:["A Franciscan friar and celebrated preacher, born in Lisbon and active in Italy and France. He was declared a Doctor of the Church in 1946.","லிஸ்பனில் பிறந்த பிரான்சிஸ்கன் துறவியும் புகழ்பெற்ற போதகருமான இவர் இத்தாலி, பிரான்ஸ் நாடுகளில் பணியாற்றினார். 1946-ல் திருச்சபை மறைவல்லுநராக அறிவிக்கப்பட்டார்."],r:["saint-francis-of-assisi"]},
{id:"saint-thomas-apostle",m:1,d:"07-03",e:"⛪",n:["Saint Thomas the Apostle","புனித தோமா திருத்தூதர்"],t:["apostle","martyr"],c:["Israel / India","இஸ்ரேல் / இந்தியா"],p:["India, architects","இந்தியா, கட்டடக் கலைஞர்"],b:["1st century","1-ஆம் நூற்றாண்டு"],bio:["One of the twelve apostles, known for professing Jesus as 'My Lord and my God' (John 20). Indian Christian tradition holds that he preached in India and was martyred near Mylapore, Chennai.","பன்னிரு திருத்தூதர்களில் ஒருவர்; 'என் ஆண்டவரே, என் கடவுளே' என இயேசுவை அறிக்கையிட்டவர். இவர் இந்தியாவில் நற்செய்தி அறிவித்து சென்னை மயிலாப்பூர் அருகே மறைசாட்சியாக இறந்தார் என இந்திய மரபு கூறுகிறது."],r:["saint-devasahayam-pillai"],tr:1},
{id:"saint-monica",d:"08-27",e:"🙏",n:["Saint Monica","புனித மோனிக்கா"],t:["confessor","layperson"],c:["Algeria","அல்ஜீரியா"],p:["Mothers, patient wives","தாய்மார், பொறுமையுள்ள மனைவியர்"],b:["c. 331–387","சு. 331–387"],bio:["Mother of Saint Augustine, who prayed for his conversion for many years. Augustine describes her faith in his Confessions.","புனித அகஸ்தீனின் தாய்; பல ஆண்டுகள் அவரது மனமாற்றத்திற்காக மன்றாடினார். அகஸ்தீன் தனது 'ஒப்புகைகள்' நூலில் இவரது விசுவாசத்தை விவரிக்கிறார்."],r:["saint-augustine"]},
{id:"saint-augustine",d:"08-28",e:"📚",n:["Saint Augustine of Hippo","புனித அகஸ்தீன்"],t:["bishop","doctor","confessor"],c:["Algeria","அல்ஜீரியா"],p:["Theologians, printers","இறையியலாளர், அச்சகத்தினர்"],b:["354–430","354–430"],bio:["Bishop of Hippo and one of the greatest Latin theologians. His Confessions tell of his restless search that ended in conversion.","ஹிப்போ ஆயரும் லத்தீன் திருச்சபையின் மிகச் சிறந்த இறையியலாளருமான இவர், தனது 'ஒப்புகைகள்' நூலில் தன் தேடலும் மனமாற்றமும் பற்றி எழுதினார்."],r:["saint-monica"]},
{id:"saint-teresa-of-calcutta",m:1,d:"09-05",e:"🕊️",n:["Saint Teresa of Calcutta","புனித கல்கத்தா தெரேசா"],t:["religious","virgin"],c:["North Macedonia / India","வடக்கு மாசிடோனியா / இந்தியா"],p:["Missionaries of Charity, the poor","பிறரன்பு மறைப்பணியாளர், ஏழைகள்"],b:["1910–1997","1910–1997"],bio:["Born Anjezë Bojaxhiu, she founded the Missionaries of Charity in Kolkata in 1950 to serve the poorest of the poor. She was canonized in 2016.","அஞ்செஸே போயாஜியு எனப் பிறந்த இவர் 1950-ல் கொல்கத்தாவில் ஏழைகளுக்குப் பணிசெய்ய பிறரன்பு மறைப்பணியாளர் சபையை நிறுவினார். 2016-ல் புனிதராக அறிவிக்கப்பட்டார்."],r:["saint-francis-of-assisi"]},
{id:"saint-wenceslaus",d:"09-28",e:"👑",n:["Saint Wenceslaus","புனித வென்செஸ்லாஸ்"],t:["martyr","king"],c:["Czech Republic","செக் குடியரசு"],p:["Czech Republic, Bohemia","செக் குடியரசு, போஹேமியா"],b:["c. 907–935","சு. 907–935"],bio:["Duke of Bohemia, raised Christian by his grandmother Saint Ludmila. He was known for charity and was murdered around 935 by his brother's followers; he was soon venerated as a martyr.","போஹேமியாவின் கோமகன்; பாட்டி புனித லுட்மிலாவால் கிறிஸ்தவராக வளர்க்கப்பட்டார். தர்மச் செயல்களுக்குப் பெயர்பெற்ற இவர் சு. 935-ல் தம் சகோதரரின் ஆதரவாளர்களால் கொல்லப்பட்டு, விரைவில் மறைசாட்சியாகப் போற்றப்பட்டார்."],r:["saint-jerome"]},
{id:"saint-jerome",d:"09-30",e:"📜",n:["Saint Jerome","புனித ஜெரோம்"],t:["priest","doctor","confessor"],c:["Croatia / Israel","குரோஷியா / இஸ்ரேல்"],p:["Translators, librarians","மொழிபெயர்ப்பாளர், நூலகர்"],b:["c. 347–420","சு. 347–420"],bio:["Scholar who translated the Bible into Latin (the Vulgate) while living in Bethlehem. He is quoted: 'Ignorance of Scripture is ignorance of Christ.'","பெத்லகேமில் வாழ்ந்து விவிலியத்தை லத்தீனில் (வுல்காத்தா) மொழிபெயர்த்த அறிஞர். 'விவிலியம் அறியாமை கிறிஸ்துவை அறியாமையே' என்பது இவரது புகழ்பெற்ற கூற்று."],r:["saint-augustine"]},
{id:"saint-therese-of-lisieux",d:"10-01",e:"🌹",n:["Saint Thérèse of Lisieux","புனித குழந்தை இயேசுவின் தெரேசா"],t:["religious","virgin","doctor"],c:["France","பிரான்ஸ்"],p:["Missions, florists","மறைப்பணிகள், பூ விற்பவர்"],b:["1873–1897","1873–1897"],bio:["A Carmelite nun who died at 24. Her autobiography, Story of a Soul, teaches the 'little way' of trust and love. She is a Doctor of the Church (1997).","24 வயதில் இறந்த கார்மேல் சபைத் துறவி. 'ஓர் ஆன்மாவின் வரலாறு' என்ற அவரது சுயசரிதை நம்பிக்கையும் அன்பும் நிறைந்த 'சிறிய வழியை' போதிக்கிறது. 1997-ல் மறைவல்லுநராக அறிவிக்கப்பட்டார்."],r:["saint-francis-of-assisi"]},
{id:"saint-francis-of-assisi",d:"10-04",e:"🐦",n:["Saint Francis of Assisi","புனித அசிசி பிரான்சிஸ்"],t:["religious","confessor"],c:["Italy","இத்தாலி"],p:["Animals, ecology, Italy","விலங்குகள், சூழலியல், இத்தாலி"],b:["1181/82–1226","1181/82–1226"],bio:["Son of a wealthy cloth merchant who embraced poverty and founded the Franciscan Order. He is known for his love of creation and his Canticle of the Creatures.","செல்வந்த துணி வணிகரின் மகனான இவர் வறுமையைத் தழுவி பிரான்சிஸ்கன் சபையை நிறுவினார். படைப்பின்மீதான அன்பிற்கும் 'படைப்புகளின் பாடலுக்கும்' பெயர்பெற்றவர்."],r:["saint-anthony-of-padua","saint-therese-of-lisieux"]},
{id:"saint-francis-xavier",d:"12-03",e:"⛵",n:["Saint Francis Xavier","புனித பிரான்சிஸ் சவேரியார்"],t:["priest","religious"],c:["Spain","ஸ்பெயின்"],p:["Missions, India, Tamil coast","மறைப்பணிகள், இந்தியா, தமிழ்க் கடற்கரை"],b:["1506–1552","1506–1552"],bio:["A Spanish Jesuit and co-founder of the Society of Jesus. He evangelized in India, including the Tamil coast, Japan and beyond, and died in 1552 on Shangchuan Island.","ஸ்பானிய இயேசு சபைத் துறவியும் அச்சபையின் நிறுவனர்களில் ஒருவரும் ஆவார். தமிழ்க் கடற்கரை உட்பட இந்தியா, ஜப்பான் ஆகிய இடங்களில் நற்செய்தி அறிவித்து 1552-ல் இறந்தார்."],r:["saint-devasahayam-pillai"]},
{id:"saint-nicholas",d:"12-06",e:"🎁",n:["Saint Nicholas","புனித நிக்கலாஸ்"],t:["bishop"],c:["Turkey","துருக்கி"],p:["Children, sailors","குழந்தைகள், மாலுமிகள்"],b:["4th century","4-ஆம் நூற்றாண்டு"],bio:["Bishop of Myra in present-day Turkey. Few historical details are certain; many well-known stories about him belong to devotional tradition.","இன்றைய துருக்கியிலுள்ள மீரா நகர ஆயர். இவரைப்பற்றிய வரலாற்று விவரங்கள் குறைவு; பிரபலமான பல கதைகள் பக்தி மரபைச் சேர்ந்தவை."],r:["saint-francis-of-assisi"],tr:1},
{id:"saint-peter",d:"06-29",m:1,e:"🗝️",n:["Saint Peter the Apostle","புனித பேதுரு திருத்தூதர்"],t:["apostle","martyr","pope"],c:["Israel / Italy","இஸ்ரேல் / இத்தாலி"],p:["The Church, fishermen","திருச்சபை, மீனவர்"],b:["1st century","1-ஆம் நூற்றாண்டு"],bio:["Simon, a fisherman of Galilee, was called by Jesus and given the name Peter. The Gospels place him first among the apostles. Catholic tradition holds that he led the Church in Rome, was martyred there under Nero, and is buried beneath St Peter's Basilica.","கலிலேயா மீனவரான சீமோன் இயேசுவால் அழைக்கப்பட்டு 'பேதுரு' என்ற பெயரைப் பெற்றார். நற்செய்திகள் இவரைத் திருத்தூதர்களில் முதன்மையானவராகக் காட்டுகின்றன. இவர் உரோமையில் திருச்சபையை வழிநடத்தி, நீரோ காலத்தில் அங்கே மறைசாட்சியாக உயிர்நீத்து, புனித பேதுரு பேராலயத்தின் கீழ் அடக்கம் செய்யப்பட்டார் என கத்தோலிக்க மரபு கூறுகிறது."],r:["saint-matthew","saint-thomas-apostle"],tr:1},
{id:"saint-kevin",d:"06-03",m:1,e:"🌿",n:["Saint Kevin of Glendalough","புனித கெவின் (குளெண்டலாக்)"],t:["priest","religious"],c:["Ireland","அயர்லாந்து"],p:["Glendalough, Ireland","குளெண்டலாக், அயர்லாந்து"],b:["6th century (died c. 618, by tradition)","6-ஆம் நூற்றாண்டு (மரபுப்படி சு. 618-ல் இறப்பு)"],bio:["Irish monk who founded the monastery of Glendalough in County Wicklow, which grew into an important centre of learning. Little about his life is documented; well-known stories such as a blackbird nesting in his hand belong to devotional tradition.","அயர்லாந்தின் விக்லோ மாவட்டத்தில் குளெண்டலாக் துறவற மடத்தை நிறுவிய துறவி; அது கல்வியின் முக்கிய மையமாக வளர்ந்தது. இவரது வாழ்வைப் பற்றிய ஆவணங்கள் குறைவு; இவர் கையில் கரிக்குருவி கூடு கட்டியது போன்ற கதைகள் பக்தி மரபைச் சேர்ந்தவை."],r:["saint-patrick"],tr:1},
{id:"saint-matthew",d:"09-21",m:1,e:"📖",n:["Saint Matthew the Apostle","புனித மத்தேயு திருத்தூதர்"],t:["apostle"],c:["Israel","இஸ்ரேல்"],p:["Accountants, tax collectors","கணக்கர், வரி வசூலிப்போர்"],b:["1st century","1-ஆம் நூற்றாண்டு"],bio:["A tax collector in Capernaum whom Jesus called to follow him (Matthew 9:9). Early Christian tradition attributes the first Gospel to him. Accounts of his later mission and death vary and are not firmly documented.","கப்பர்நாகூமில் வரி வசூலித்தவரான இவரை இயேசு தம்மைப் பின்தொடர அழைத்தார் (மத்தேயு 9:9). முதல் நற்செய்தியை இவர் எழுதினார் என ஆதி கிறிஸ்தவ மரபு கூறுகிறது. இவரது பிற்கால மறைப்பணி, இறப்பு பற்றிய தகவல்கள் வேறுபடுகின்றன; உறுதியாக ஆவணப்படுத்தப்படவில்லை."],r:["saint-peter","saint-thomas-apostle"],tr:1},
{id:"saint-lucy",d:"12-13",m:1,e:"🕯️",n:["Saint Lucy of Syracuse","புனித லூசியா (சிராகூசு)"],t:["martyr","virgin"],c:["Italy","இத்தாலி"],p:["The blind, eye illnesses","பார்வையற்றோர், கண் நோய்"],b:["died c. 304","சு. 304-ல் இறப்பு"],bio:["A young Christian woman of Syracuse in Sicily, martyred around 304 during the persecution under Diocletian. Her veneration is ancient and widespread; many details of her legend, including the stories about her eyes, are devotional tradition.","சிசிலியிலுள்ள சிராகூசு நகரின் இளம் கிறிஸ்தவப் பெண்; தியோக்லேசியன் கொடுமைக் காலத்தில் சு. 304-ல் மறைசாட்சியானார். இவருக்கான வணக்கம் மிகப் பழமையானது, பரவலானது; கண்கள் பற்றிய கதைகள் உட்பட இவரது வரலாற்றுக் கதையின் பல விவரங்கள் பக்தி மரபைச் சேர்ந்தவை."],r:["saint-sebastian","saint-teresa-of-calcutta"],tr:1},
{id:"saint-sebastian",d:"01-20",m:1,e:"🏹",n:["Saint Sebastian","புனித செபஸ்தியார்"],t:["martyr"],c:["Italy","இத்தாலி"],p:["Soldiers, athletes, plague sufferers","படைவீரர், விளையாட்டு வீரர், கொள்ளைநோயாளர்"],b:["died c. 288","சு. 288-ல் இறப்பு"],bio:["A Roman martyr venerated in Rome from early times and buried on the Appian Way. Tradition says he was a soldier who was shot with arrows and later clubbed to death under Diocletian; details come largely from later accounts.","பண்டைக் காலம் முதல் உரோமையில் வணங்கப்பட்டு அப்பியன் சாலையில் அடக்கம் செய்யப்பட்ட மறைசாட்சி. இவர் படைவீரராக இருந்து அம்புகளால் தாக்கப்பட்டு, பின்னர் தியோக்லேசியன் காலத்தில் தடியால் அடித்துக் கொல்லப்பட்டார் என மரபு கூறுகிறது; விவரங்கள் பெரும்பாலும் பிற்கால ஆதாரங்களைச் சேர்ந்தவை."],r:["saint-lucy","saint-devasahayam-pillai"],tr:1}];
const V=[["Psalm 23:1","The Lord is my shepherd; I shall not want.","சங்கீதம் 23:1","ஆண்டவரே என் ஆயர்; எனக்கு எக்குறையும் இராது."],["Matthew 5:8","Blessed are the pure in heart, for they will see God.","மத்தேயு 5:8","தூய உள்ளத்தோர் பேறுபெற்றோர்; ஏனெனில் அவர்கள் கடவுளைக் காண்பர்."],["Philippians 4:13","I can do all things through him who strengthens me.","பிலிப்பியர் 4:13","எனக்கு வலிமை அளிக்கும் கிறிஸ்துவின் துணையால் என்னால் அனைத்தையும் செய்ய முடியும்."]];
const P=[["Daily Prayer","இன்றைய செபம்","Lord, guide my steps today. Help me to love, to forgive and to serve. Amen.","ஆண்டவரே, இன்று என் அடிகளை வழிநடத்தும். அன்பு செய்யவும் மன்னிக்கவும் பணிசெய்யவும் எனக்கு உதவும். ஆமென்."],["Saint's Prayer","புனிதரின் செபம்","Holy friend of God, pray for us, that we may follow Christ as you did. Amen.","இறைவனின் நண்பரே, நீர் கிறிஸ்துவைப் பின்பற்றியது போல நாங்களும் பின்பற்ற எங்களுக்காக வேண்டிக்கொள்ளும். ஆமென்."],["Morning Prayer","காலைச் செபம்","God, thank you for this new day. Bless my work, my family and all I meet. Amen.","இறைவா, இந்தப் புதிய நாளுக்காக நன்றி. என் பணி, என் குடும்பம், நான் சந்திப்போர் அனைவரையும் ஆசீர்வதியும். ஆமென்."],["Evening Prayer","மாலைச் செபம்","Thank you, Lord, for this day. Forgive my faults and grant me peaceful rest. Amen.","ஆண்டவரே, இந்த நாளுக்காக நன்றி. என் குற்றங்களை மன்னித்து அமைதியான ஓய்வு தாரும். ஆமென்."],["Prayer for Families","குடும்பங்களுக்கான செபம்","Lord, bless our home with love, patience and peace. Keep us united in you. Amen.","ஆண்டவரே, எங்கள் இல்லத்தை அன்பு, பொறுமை, அமைதியால் ஆசீர்வதியும். உம்மில் எங்களை ஒன்றுபடுத்தும். ஆமென்."],["Prayer for Students","மாணவர்களுக்கான செபம்","Lord, give students wisdom, focus and courage. Help them learn with honesty. Amen.","ஆண்டவரே, மாணவர்களுக்கு ஞானம், கவனம், தைரியம் தாரும். நேர்மையுடன் கற்க உதவும். ஆமென்."],["Prayer for the Sick","நோயுற்றோருக்கான செபம்","Lord Jesus, heal the sick, comfort the suffering and strengthen those who care for them. Amen.","இயேசு ஆண்டவரே, நோயுற்றோரைக் குணமாக்கும்; துன்புறுவோருக்கு ஆறுதல் தாரும்; அவர்களைக் கவனிப்போரை வலுப்படுத்தும். ஆமென்."],["Hail Mary (Mother Mary)","அருள் நிறைந்த மரியே (அன்னை மரியா)","Hail Mary, full of grace, the Lord is with thee. Blessed art thou among women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.","அருள் நிறைந்த மரியாவே வாழ்க! ஆண்டவர் உம்முடன் இருக்கிறார். பெண்களுக்குள் ஆசீர்பெற்றவர் நீரே; உம்முடைய திருவயிற்றின் கனியாகிய இயேசுவும் ஆசீர்பெற்றவரே. புனித மரியாவே, இறைவனின் தாயே, பாவிகளாகிய எங்களுக்காக இப்போதும் எங்கள் மரண நேரத்திலும் வேண்டிக்கொள்ளும். ஆமென்."]];
let L=localStorage.getItem?(()=>{try{return localStorage.getItem("sotd-l")||"en"}catch(e){return"en"}})():"en";
let view="home",arg=null,cal=new Date(),f={q:"",t:"",c:"",m:""},selDate=null;
const $=s=>document.getElementById(s),i=k=>T[L][k],li=L2=>L==="en"?0:1;
function setL(x){L=x;try{localStorage.setItem("sotd-l",x)}catch(e){}render()}
const mmdd=d=>String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function saintFor(d){const k=mmdd(d);let s=S.find(x=>x.d===k);if(s)return s;const y=d.getFullYear();let best=null,bd=1e9;S.forEach(x=>{let t=new Date(y,+x.d.slice(0,2)-1,+x.d.slice(3));let df=Math.abs(t-d);if(df<bd){bd=df;best=x}});return best}
const exact=d=>S.find(x=>x.d===mmdd(d));

const nav=["home","saints","calendar","prayers","videos","about"],ic={home:"🏠",saints:"✝️",calendar:"📅",prayers:"🙏",videos:"▶️",about:"ℹ️"};
function card(s){return `<div class="card" tabindex="0" role="link" onclick="go('saint','${s.id}')" onkeydown="if(event.key==='Enter')go('saint','${s.id}')"><div class="em">${s.e}</div><h3>${s.n[li()]}</h3><div class="meta">${fs(s)} · ${s.c[li()]}</div></div>`}
function vid(s){return `<div class="vid" role="img" aria-label="Video coming soon">▶</div><p class="note">${i("vNote")}</p>`}
function hero(s,d){return `<section class="hero"><img class="hl" alt="Saint of the Day – 365 Days of Faith" src="${LOGO}"><h1 class="sr">${i("brand")} – ${i("tag")}</h1><p>${d.toLocaleDateString(L==="en"?"en-GB":"ta-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p><div class="portrait" role="img" aria-label="${s.n[li()]}">${s.e}</div><h2>${s.n[li()]}</h2><p>${i("feast")}: ${fs(s)}</p><p>${s.bio[li()].split(". ")[0]}.</p><button class="btn" onclick="go('saint','${s.id}')">${i("read")}</button><button class="btn alt" onclick="go('videos')">${i("watch")}</button></section>`}
function match(s,q){q=q.toLowerCase();return [s.n[0],s.n[1],s.c[0],s.c[1],s.p[0],s.p[1],fs(s),s.d,s.bio[0],s.bio[1]].join(" ").toLowerCase().includes(q)}
function results(){let q=f.q.trim().toLowerCase(),o=S.filter(s=>(!q||match(s,q))&&(!f.t||s.t.includes(f.t))&&(!f.c||s.c[0]===f.c)&&(!f.m||+s.d.slice(0,2)-1==f.m));
let ex="";if(q){const pr=P.filter(p=>(p[0]+p[1]+p[2]+p[3]).toLowerCase().includes(q)),vs=V.filter(v=>v.join(" ").toLowerCase().includes(q));ex=pr.map(p=>`<div class="card"><h3>🙏 ${p[li()]}</h3><div>${p[2+li()]}</div></div>`).join("")+vs.map(v=>`<div class="card"><h3>📖 ${v[li()*2]}</h3><div>${v[1+li()*2]}</div></div>`).join("")}
o.sort((a,b)=>(b.m||0)-(a.m||0));return (o.map(card).join("")+ex)||`<p>${i("none")}</p>`}
function upd(k,v){f[k]=v;$("res").innerHTML=results()}

if(view==="home"){const s=saintFor(now),n=saintFor(tm),v=V[now.getDate()%V.length],p=P[0];
return hero(s,now)+`<div class="sec"><input type="search" aria-label="search" placeholder="${i("search")}" onkeydown="if(event.key==='Enter'){f.q=this.value;go('saints')}"></div><div class="sec"><h2>${i("today")} / ${i("tomorrow")}</h2><div class="grid">${card(s)}${card(n)}</div></div><div class="sec"><h2>${i("recent")}</h2><div class="grid">${S.filter(x=>x.d<mmdd(now)).slice(-3).map(card).join("")}</div></div><div class="sec"><h2>${i("popular")}</h2><div class="grid">${["saint-peter","saint-kevin","saint-teresa-of-calcutta","saint-thomas-apostle","saint-matthew","saint-devasahayam-pillai","saint-lucy","saint-anthony-of-padua","saint-sebastian"].map(id=>card(S.find(x=>x.id===id))).join("")}</div></div><div class="sec grid"><div><h2>${i("dp")}</h2><p>${p[2+li()]}</p></div><div><h2>${i("bv")}</h2><div class="verse">${v[1+li()*2]}<br><small>${v[li()*2]}</small></div></div></div>`}
if(view==="saints"){const cs=[...new Set(S.map(x=>x.c[0]))].sort(),ts=["martyr","pope","bishop","priest","religious","virgin","confessor"];
return `<h1>${i("saints")}</h1><input type="search" aria-label="search" value="${f.q}" placeholder="${i("search")}" oninput="upd('q',this.value)"><div class="filters"><select aria-label="${i("m")}" onchange="upd('m',this.value)"><option value="">${i("m")}: ${i("all")}</option>${T[L].months.map((m,k)=>`<option value="${k}" ${f.m==k?"selected":""}>${m}</option>`).join("")}</select><select aria-label="${i("c")}" onchange="upd('c',this.value)"><option value="">${i("c")}: ${i("all")}</option>${cs.map(c=>`<option ${f.c===c?"selected":""}>${c}</option>`).join("")}</select><select aria-label="${i("type")}" onchange="upd('t',this.value)"><option value="">${i("type")}: ${i("all")}</option>${ts.map(t=>`<option value="${t}" ${f.t===t?"selected":""}>${i(t)}</option>`).join("")}</select></div><div class="grid" id="res">${results()}</div>`}
if(view==="saint"){const s=S.find(x=>x.id===arg)||S[0],vv=V[S.indexOf(s)%V.length];
return `<button class="chip" onclick="go('saints')">← ${i("backL")}</button><h1>${s.e} ${s.n[li()]}</h1><div>${s.t.map(t=>`<span class="tag2">${i(t)}</span>`).join("")}<span class="tag2">${s.tr?i("ttag"):i("dtag")}</span></div><div class="grid" style="margin:12px 0"><div><b>${i("feast")}:</b> ${fs(s)}</div><div><b>${i("born")}:</b> ${s.b[li()]}</div><div><b>${i("country")}:</b> ${s.c[li()]}</div><div><b>${i("patron")}:</b> ${s.p[li()]}</div></div><h2>${i("bio")}</h2><p>${s.bio[li()]}</p><h2>${i("prayer")}</h2><p>${P[1][2+li()]}</p><h2>${i("verse")}</h2><div class="verse">${vv[1+li()*2]}<br><small>${vv[li()*2]}</small></div><h2>${i("video")}</h2>${vid(s)}<p class="note">${i("src")}</p><h2>${i("related")}</h2><div class="grid">${s.r.map(id=>S.find(x=>x.id===id)).filter(Boolean).map(card).join("")}</div>`}
if(view==="calendar"){const y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells=T[L].dow.map(d=>`<b>${d}</b>`).join("")+"<span></span>".repeat(first);
for(let d=1;d<=days;d++){const dt=new Date(y,m,d),has=exact(dt);cells+=`<button class="${has?"has":""} ${selDate&&+selDate===+dt?"sel":""}" onclick="selDate=new Date(${y},${m},${d});render()">${d}</button>`}

if(view==="prayers")return `<h1>${i("prayers")}</h1>${P.map(p=>`<div class="card" style="cursor:default;margin-bottom:12px"><h3>🙏 ${p[li()]}</h3><p>${p[2+li()]}</p></div>`).join("")}`;
if(view==="videos")return `<h1>${i("videos")}</h1><div>${Object.values(T[L].vt).map(c=>`<span class="tag2">${c}</span>`).join("")}</div><div class="grid" style="margin-top:12px">${Object.values(T[L].vt).map(c=>`<div>${vid()}<h3>${c}</h3></div>`).join("")}</div><p><a class="btn dk" style="display:inline-flex;align-items:center;text-decoration:none" href="https://www.youtube.com" target="_blank" rel="noopener">${i("sub")}</a></p>`;
if(view==="about")return `<h1>${i("aboutT")}</h1><div class="verse">${i("aboutB")}</div><p class="note">${i("src")}</p><p><a href="#admin">${i("admin")}</a></p>`;
if(view==="admin")return `<h1>${i("admin")}: ${i("addS")}</h1><p class="note">${i("adminN")}</p><div class="grid"><div><label>${i("fname")}<input id="a1"></label></div><div><label>${i("fnameT")}<input id="a2"></label></div><div><label>${i("fdate")}<input id="a3" type="date"></label></div><div><label>${i("fcty")}<input id="a4"></label></div><div><label>${i("fvid")}<input id="a5"></label></div></div><label>${i("fbio")}<textarea id="a6" rows="3"></textarea></label><label>${i("fbioT")}<textarea id="a7" rows="3"></textarea></label><p><button class="btn dk" onclick="addS()">${i("save")}</button> <span id="ok"></span></p>`}
function addS(){const n=$("a1").value.trim();if(!n)return;const d=$("a3").value||"01-01",id="saint-"+n.toLowerCase().replace(/[^a-z0-9]+/g,"-");S.push({id,d:d.slice(-5),e:"✝️",n:[n,$("a2").value||n],t:[],c:[$("a4").value,$("a4").value],p:["",""],b:["",""],bio:[$("a6").value,$("a7").value||$("a6").value],r:[]});$("ok").textContent=i("saved")}
function render(){document.documentElement.lang=L==="ta"?"ta":"en";document.querySelectorAll("[data-i]").forEach(e=>e.textContent=i(e.dataset.i));$("l-en").className=L==="en"?"on":"";$("l-ta").className=L==="ta"?"on":"";
